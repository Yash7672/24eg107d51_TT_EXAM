# ===========================================================================
#  Netlify configuration for the React frontend.
#
#  If you configure these values in the Netlify dashboard instead, the
#  dashboard wins. The settings here match the instructions in the README:
#      Base directory    = frontend
#      Build command     = npm run build
#      Publish directory = dist
# ===========================================================================

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Single page application: unknown routes are handled by react-router,
# so every request that is not a real file falls back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
