# ===========================================================================
#  Test configuration - an in-memory H2 database, never a real one.
#  This file replaces the main application.properties during the tests.
# ===========================================================================
spring.datasource.url=jdbc:h2:mem:labexam;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173
