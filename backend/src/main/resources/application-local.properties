# ===========================================================================
#  LOCAL PROFILE - for development on your own machine only.
#
#  Activate it with:
#     mvn spring-boot:run -Dspring-boot.run.profiles=local
#
#  It contains placeholders for a MySQL that runs on localhost. These are NOT
#  real credentials - the real Aiven values are read from the environment
#  variables SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
# ===========================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/labexam?serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# A local MySQL normally has no TLS and no Aiven certificate, so the SSL
# check of the main configuration is switched off here.
spring.datasource.hikari.data-source-properties.sslMode=DISABLED
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=

# Do not create tables automatically here. Use LOCAL_DDL_AUTO=update when you
# want Spring to create the tables of your local database.
spring.jpa.hibernate.ddl-auto=${LOCAL_DDL_AUTO:none}

# Start the application even when the local database is not running, so that
# the health endpoint can report "database: DOWN" instead of blocking startup.
spring.datasource.hikari.initialization-fail-timeout=-1
