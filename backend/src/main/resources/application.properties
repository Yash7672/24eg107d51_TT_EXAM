# ===========================================================================
#  lab-exam-backend - main configuration
#
#  RULE OF THIS PROJECT: real values live in environment variables, never in
#  this file. Every ${NAME:default} below only holds a LOCAL fallback value
#  so that the project can also be started on your own machine.
#  In production (Render) the environment variables always win.
# ===========================================================================

spring.application.name=lab-exam-backend

# Render injects PORT. 8080 is the local default.
server.port=${PORT:8080}

# Graceful shutdown so Render can stop the container cleanly.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------------------------------------------------------------------------
#  Database (Aiven MySQL)
# ---------------------------------------------------------------------------
# Full JDBC URL of the database. It contains the host, the port and the
# database name - the SSL settings are configured separately below.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/labexam?serverTimezone=UTC&allowPublicKeyRetrieval=true}
# LOCAL PLACEHOLDER ONLY - always replace with the real Aiven user.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# LOCAL PLACEHOLDER ONLY - always replace with the real Aiven password.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# Keep it short: the health endpoint asks for a connection and must answer
# quickly, also when the database is not reachable.
spring.datasource.hikari.connection-timeout=5000

# ---------------------------------------------------------------------------
#  SSL for Aiven
# ---------------------------------------------------------------------------
# These are JDBC connection properties. They are set on the connection itself,
# so they win over the same parameter inside the JDBC URL.
#
# VERIFY_IDENTITY encrypts the connection AND checks the certificate of the
# Aiven server. "REQUIRED" would only encrypt the traffic without checking
# who it comes from - that is not enough, so VERIFY_IDENTITY is the default.
spring.datasource.hikari.data-source-properties.sslMode=${SPRING_DATASOURCE_SSL_MODE:VERIFY_IDENTITY}
# The truststore holds the public Aiven CA certificate (see backend/certs).
# In the Docker image it is already at /app/certs/truststore.p12.
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=${SPRING_DATASOURCE_TRUSTSTORE_TYPE:PKCS12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${SPRING_DATASOURCE_TRUSTSTORE_URL:}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${SPRING_DATASOURCE_TRUSTSTORE_PASSWORD:}

# ---------------------------------------------------------------------------
#  JPA / Hibernate
# ---------------------------------------------------------------------------
# "update" creates missing tables and columns and never deletes data.
# NEVER use "create-drop" or "drop" against a real database.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# The dialect is given explicitly, so Hibernate does not need a connection just
# to find out which database it is talking to.
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
#  JSON
# ---------------------------------------------------------------------------
# Dates are written as "2026-01-31T10:15:30Z" instead of a number.
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------------
#  CORS
# ---------------------------------------------------------------------------
# Comma separated list of frontend origins that are allowed to call this API.
# Local: http://localhost:5173   |   Production: https://<your-site>.netlify.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
#  Logging
# ---------------------------------------------------------------------------
logging.level.com.labexam=INFO
